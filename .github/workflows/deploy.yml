name: Deploy

# Off until the repository variable DEPLOY_ENABLED is "true" (see deploy/README.md).
# After that, every push to main that passes CI goes live. To roll back, run this
# workflow by hand with the commit SHA of an earlier release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Full commit SHA of an earlier release to go back to. Leave empty to release main.
        required: false

# A release in progress always finishes before the next one starts.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build and release
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        if: inputs.tag == ''
      - name: Build and publish the image
        if: inputs.tag == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            APP_VERSION=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<CONFIG
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CONFIG
      - name: Copy the deploy files to the server
        run: tar -C deploy --exclude='*.example' --exclude='docker-compose.ci.yml' -czf - . | ssh vps 'tar -xzf - -C /srv/sidana'
      - name: Release on the server
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh vps "/srv/sidana/scripts/deploy.sh '$TAG'"
      - name: Sign the server out of the registry
        if: always()
        run: ssh vps 'docker logout ghcr.io' || true
      - name: Check the live site
        run: deploy/scripts/smoke-test.sh "${{ vars.PROD_URL }}"
