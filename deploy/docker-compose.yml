# The production stack. It lives in /srv/sidana on the VPS, and deploy/scripts/dc.sh
# runs Compose with the right settings files.
name: sidana

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE}:${APP_TAG:?set APP_TAG}
    restart: unless-stopped
    init: true
    env_file: app.env
    environment:
      # Keeps the Node heap well under the memory limit below.
      NODE_OPTIONS: --max-old-space-size=${APP_HEAP_MB:-700}
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
      # The data cache. It starts empty on each deploy, so no old data survives a release.
      - /app/.next/cache:uid=1001,gid=1001,mode=0700,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Next.js shares its data cache and tag invalidation within one process, so run one
    # instance. It comfortably handles this load; see deploy/README.md before adding more.
    mem_limit: ${APP_MEMORY:-1g}
    logging: *logging

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/site-templates:/etc/nginx/site-templates:ro
      - ./nginx/html:/usr/share/nginx/sidana:ro
      - ./nginx/05-select-site.sh:/docker-entrypoint.d/05-select-site.sh:ro
      - certs:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *logging

  # Renews the HTTPS certificate. Set COMPOSE_PROFILES=tls in deploy/.env to run it.
  certbot:
    image: certbot/certbot:v5.9.0
    restart: unless-stopped
    profiles: ["tls"]
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"]
    volumes:
      - certs:/etc/letsencrypt
      - acme:/var/www/certbot
    logging: *logging

volumes:
  certs:
  acme:
