set $app http://app:3000;

limit_conn per_ip 100;

error_page 502 504 =503 /updating.html;
location = /updating.html {
  internal;
  root /usr/share/nginx/sidana;
  add_header Retry-After 10 always;
  add_header Cache-Control "no-store" always;
}

location ^~ /_next/static/ {
  include /etc/nginx/snippets/proxy.conf;
  proxy_cache static;
  proxy_cache_valid 200 30d;
  proxy_pass $app;
}

location ~ /\.(?!well-known) {
  return 404;
}

# Passwords are posted to these two pages.
location ~ ^/(login|teamonly)$ {
  limit_req zone=sign_in burst=10 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass $app;
}

location / {
  # Page navigation prefetches several links at once, so the burst is generous.
  limit_req zone=general burst=100 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  # Pages stream their content as it loads.
  proxy_buffering off;
  proxy_pass $app;
}
