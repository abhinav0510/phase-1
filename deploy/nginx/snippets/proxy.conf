proxy_http_version 1.1;
# Server actions compare Origin with the forwarded host, so these must be the real values.
# Unknown hosts never get here: the default server drops them.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
# Overwritten, not appended, because nginx is the first hop and clients could fake it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";
# An internal Next.js header that outsiders must never be able to set.
proxy_set_header x-middleware-subrequest "";
proxy_connect_timeout 5s;
# Admin sends can wait 30 seconds on n8n.
proxy_read_timeout 60s;
proxy_send_timeout 60s;
