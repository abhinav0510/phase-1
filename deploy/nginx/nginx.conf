worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,'
    '"upstream_seconds":"$upstream_response_time","agent":"$http_user_agent"}';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # Logos are capped at 2 MB by the app; multipart overhead needs the rest.
  client_max_body_size 4m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Docker's DNS. Looking the app up per request means nginx keeps working when a deploy
  # replaces the app container, and can start while the app is down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Only POSTs count towards the sign-in limit, so reloading the page never does.
  map $request_method $sign_in_limit_key {
    POST    $binary_remote_addr;
    default "";
  }
  limit_req_zone $sign_in_limit_key zone=sign_in:5m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=per_ip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Kept across deploys, so a tab left open during a release still finds its old JS files.
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=256m inactive=30d use_temp_path=off;

  include /etc/nginx/conf.d/site.conf;
}
